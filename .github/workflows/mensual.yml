name: Actualizacion Mensual SPY

on:
  # Se ejecuta los días 28, 29, 30 y 31 de cada mes a las 22:00 UTC (19:00 hs Argentina / 17:00 NY)
  # Como el script sobrescribe el mes actual si ya existe, los días 28-31 va actualizando el cierre
  # hasta quedar con el dato exacto del último día hábil del mes.
  schedule:
    - cron: '0 22 28-31 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón cuando quieras probarlo

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías necesarias
        run: pip install pandas requests yfinance openpyxl lxml html5lib

      - name: Ejecutar script de actualización
        run: python actualizar_spy.py

      - name: Guardar el Excel actualizado en GitHub
        run: |
          git config user.name "Bot Actualizador"
          git config user.email "bot@users.noreply.github.com"
          git add SP500_Sectores_Historico.xlsx
          git commit -m "Actualización automática sectores SPY" || exit 0
          git push
